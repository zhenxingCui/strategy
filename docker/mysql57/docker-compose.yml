name: strategy-review-mysql57

services:
  mysql:
    image: strategy-review-db:mysql57-20261026
    container_name: strategy-review-mysql57-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-123456}"
      MYSQL_DATABASE: strategy_review_active_class_local
      MYSQL_USER: strategy_review
      MYSQL_PASSWORD: "${MYSQL_APP_PASSWORD:-strategy_review}"
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max-allowed-packet=256M
    volumes:
      - strategy_review_mysql57_data:/var/lib/mysql
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30s

  app:
    image: strategy-review-app:mysql57-20261026
    container_name: strategy-review-mysql57-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      SR_DB_URL: "jdbc:mysql://mysql:3306/strategy_review_active_class_local?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true"
      SR_DB_USER: strategy_review
      SR_DB_PASSWORD: "${MYSQL_APP_PASSWORD:-strategy_review}"
    ports:
      - "${WEB_PORT:-8081}:80"
      - "${API_PORT:-8080}:8080"

volumes:
  strategy_review_mysql57_data:
